[project]
name = "layout-pdf-agent-server"
version = "0.1.0"
description = "Agent server that adapts PDF layout to JSON data structures"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.3.4",
    "jinja2",
    "python-multipart",
]

[project.scripts]
server = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
